    "Delta 3a: una ventana de batch con varias filas consecutivas del MISMO slot (lo que produce --batch-mtp: 1 token confirmado + 1 drafteado por slot) cruza el hand-off de un layer split. El hand-off es por FILA de la ventana (hrow0 + t), contiguo e indexado igual en cada etapa, asi que una fila repetida no lo rompe; el estado por slot (GDN, QSA/indexer, PLE) ya se maneja por grupos de filas contiguas del mismo slot. El techo es la capacidad del hand-off (kVerifyMaxT filas), NO el conteo de slots.",
